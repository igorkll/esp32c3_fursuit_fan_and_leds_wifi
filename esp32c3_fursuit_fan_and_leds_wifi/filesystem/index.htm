<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icon.png" type="image/x-icon">
    <title>Fursuit controller</title>
    <style>
        @font-face {
            font-family: 'Victor Mono';
            src: url('Victor_Mono/VictorMono-Regular.ttf') format('truetype');
        }
        
        body {
            font-family: 'Victor Mono', monospace;
        }

        *, ::after, ::before {
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        img {
            -webkit-user-drag: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;

            user-select: none;
        }

        body {
            background-color: #222222;

            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 20px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 15px;

            position: relative;
        }

        .controller {
            border-radius: 8px;
            background-color: #5a5a5a;

            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
            gap: 10px;
            padding: 10px;

            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;

            max-width: 500px;
            max-height: calc(min(1000px, 80%));
            overflow-y: auto;

            transition: opacity 0.5s;
            opacity: 1;
        }

        .controller-closed {
            opacity: 0;
            pointer-events: none;
        }

        .controller-overlay {
            z-index: 50;
            box-shadow: 0px 0px 25px 5px #ffffff;
        }

        .container {
            display: flex;
            justify-content: flex-start;
            gap: 10px;

            background-color: #333333;
            padding: 10px;
            border-radius: 16px;
        }

        .container-verticle {
            flex-direction: column;
            align-items: stretch;
        }

        .vcontainer {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            gap: 10px;
        }

        .hcontainer {
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: center;
            gap: 10px;
        }

        .button {
            background-color: rgb(212, 212, 212);
            border: none;
            cursor: pointer;
            transition: background-color 0.1s;
            border-radius: 8px;
            color: #333333;
            width: 48px;
            height: 48px;
            border: 2px solid #ffffff;
            font-size: 35px;
        }

        .button:active {
            background-color: rgb(121, 121, 121);
        }


        .back-to-main {
            background-color: rgb(209, 32, 32);
            border: none;
            cursor: pointer;
            transition: background-color 0.1s;
            border-radius: 8px;
            color: #333333;
            width: 48px;
            height: 48px;
            border: 2px solid #ffffff;
            color: #ffffff;
            font-size: 35px;
        }

        .back-to-main:active {
            background-color: rgb(133, 12, 12);
        }

        

        .button-flat {
            background-color: rgb(212, 212, 212);
            border: none;
            cursor: pointer;
            transition: background-color 0.1s;
            border-radius: 8px;
            color: #333333;
            width: 50px;
            height: 25px;
            border: 2px solid #ffffff;
        }


        .button-flat:active {
            background-color: rgb(121, 121, 121);
        }

        .slider {
            flex: 1;
            margin: 0;

            appearance: none;
            background: transparent;
        }

        /* Дорожка (полоса) */
        .slider::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: #080808;
            border-radius: 9999px;
        }

        /* Бегунок (кнопка) */
        .slider::-webkit-slider-thumb {
            appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: rgb(212, 212, 212);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            margin-top: -8px; /* Выравнивание бегунка по центру дорожки */
            cursor: pointer;
        }

        .title {
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .constsize-title {
            text-align: start;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            width: 90px;
        }

        .selecter {
            all: unset;
            text-align: center;
            color: #333333;
            background-color: rgb(212, 212, 212);
            border-radius: 8px;
            padding: 15px;
        }

        .filler {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: stretch;
        }

        .filler-line {
            height: 2px;
            border-radius: 9999px;
            width: 100%;
            background-color: #080808;
        }

        .bigfont {
            font-size: 40px;
        }

        .developer-info {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            height: 50px;
            width: 100%;
            max-width: 600px;
            background-color: rgb(91, 63, 26);
            z-index: 1000;
        }

        .developer-image {
            height: 100%;
            aspect-ratio: 1 / 1;
        }

        .developer-title {
            text-align: center;
            flex: 1;
        }

        .smallfont {
            font-size: 15px;
        }

        .size-normalizer {
            position: relative;
        }

        .size-normalizer > * {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .colorpicker {
            all: unset;
            cursor: pointer;
            width: 50px;
            height: 25px;
        }

        .colorpicker::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .colorpicker::-webkit-color-swatch {
            border: 2px solid #ffffff;
            border-radius: 8px;
        }

        .switch {
            appearance: none;

            width: 50px;
            height: 28px;

            background: #ccc;
            border-radius: 999px;

            position: relative;
            cursor: pointer;

            transition: 0.2s;
        }

        .switch::before {
            content: "";

            position: absolute;

            width: 22px;
            height: 22px;

            left: 3px;
            top: 3px;

            border-radius: 50%;
            background: white;

            transition: 0.2s;
        }

        .switch:checked {
            background: #4caf50;
        }

        .switch:checked::before {
            transform: translateX(22px);
        }

        .enable-switch {
            appearance: none;

            width: 100px;
            height: 50px;

            background: #ccc;
            border-radius: 999px;
            outline: 2px solid #f5f5f5;

            position: relative;
            cursor: pointer;

            transition: 0.2s;
        }

        .enable-switch::before {
            content: "";

            position: absolute;

            width: calc(50px - (6px * 2));
            height: calc(50px - (6px * 2));

            left: 6px;
            top: 6px;

            border-radius: 50%;
            background: white;

            transition: 0.2s;
        }

        .enable-switch:checked {
            background: #4caf50;
            outline: 2px solid #61ea68;
        }

        .enable-switch:checked::before {
            transform: translateX(calc(100px - 50px));
        }

        .maincontainer {
            box-shadow: 0px 0px 16px #4aa54f;
            background-color: #214e23;
        }

        .maincontainer-filler-line {
            background-color: #4aa54f;
        }

        .bluecontainer {
            box-shadow: 0px 0px 16px #4aa0a5;
            background-color: #214a4e;
        }

        .bluecontainer-filler-line {
            background-color: #4aa0a5;
        }

        .loading-process {
            position: absolute;
            top: 0px;
            left: 0px;
            width: 100%;
            height: 100%;

            background-color: #6b6b6b78;
            backdrop-filter: blur(20px);

            z-index: 100;

            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 20vw;

            overflow: hidden;

            text-shadow: 0px 0px 6px #000000;
        }
    </style>
</head>
<body>
    <div class="loading-process" id="loading-process">
        LOADING
    </div>

    <div class="title bigfont">Fursuit controller</div>

    <div class="controller controller-closed controller-overlay" id="led-setup">
        <div class="container maincontainer">
            <div class="hcontainer">
                <button class="back-to-main">
                    &lt;
                </button>

                <div class="constsize-title">Separate colors</div>
            </div>

            <div class="filler">
                <div class="filler-line maincontainer-filler-line"></div>
            </div>

            <div class="enable-switch-container">
                <input type="checkbox" id="enable-separate" class="enable-switch">
            </div>
        </div>
    </div>

    <div class="controller" id="main-setup">
        <div class="container maincontainer">
            <div class="constsize-title">Enabled</div>

            <div class="filler">
                <div class="filler-line maincontainer-filler-line"></div>
            </div>

            <div class="enable-switch-container">
                <input type="checkbox" id="enable-switch" class="enable-switch">
            </div>
        </div>

        <div class="container">
            <div class="constsize-title">Light</div>
            <input type="range" min="0" max="255" value="0" class="slider" id="light_slider">
            <button id="light_reset" class="button">↺</button>
        </div>
        
        <div class="container">
            <div class="constsize-title">Colors</div>

            <div class="filler">
                <div class="filler-line"></div>
            </div>

            <div class="vcontainer">
                <div class="title smallfont">primary</div>
                <input class="colorpicker" type="color" id="primary_color">
            </div>
            
            <div class="vcontainer">
                <div class="title smallfont">separate</div>
                <button class="button-flat" id="separate-button">SETS</button>
            </div>
        </div>

        <div class="container bluecontainer">
            <div class="constsize-title">Fan</div>

            <div class="filler">
                <div class="filler-line bluecontainer-filler-line"></div>
            </div>

            <div class="enable-switch-container">
                <input type="checkbox" id="fan-switch" class="fan-switch">
            </div>
        </div>
    </div>

    <div class="developer-info">
        <div class="size-normalizer developer-image">
            <img src="icon.png"></img>
        </div>
        <div class="developer-title smallfont">
            Сделано лапками выдры Logiкусь
        </div>
    </div>

    <script>
        function send(name, data="") {
            return fetch(`http://${window.location.hostname}/${name}`, {
                method: "POST",
                body: data,
                headers: {
                    "Content-type": "application/json; charset=UTF-8"
                }
            });
        }

        function getByteFromString(str, index=0) {
            const encoder = new TextEncoder();
            const byteArray = encoder.encode(str);
            return byteArray.length > index ? byteArray[index] : 0;
        }

        function bindSlider(slider, resetButtonName, defaultValue, encodeCallback, endpointBasename) {
            let endpointWithSave = `${endpointBasename}_and_save`

            let lastExecutionTime = 0;
            const throttleDelay = 200;
            let timerId = null;

            slider.oninput = function() {
                const currentTime = Date.now();
                if (currentTime - lastExecutionTime >= throttleDelay) {
                    send(endpointBasename, encodeCallback(slider.value));
                    lastExecutionTime = currentTime;

                    if (timerId) clearTimeout(timerId);
                    timerId = setTimeout(throttleDelay, () => {
                        send(endpointBasename, encodeCallback(slider.value));
                        lastExecutionTime = Date.now();
                    });
                }
            }

            slider.addEventListener('pointerup', function() {
                if (timerId) clearTimeout(timerId);
                timerId = null;
                
                send(endpointWithSave, encodeCallback(slider.value));
            });

            document.getElementById(resetButtonName).addEventListener('click', () => {
                if (timerId) clearTimeout(timerId);
                timerId = null;

                slider.value = defaultValue;
                send(endpointWithSave, encodeCallback(slider.value));
            });
        }

        function sliderFormatByte(value) {
            return new Uint8Array([value])
        }

        function sliderFormatString(value) {
            return value.toString()
        }

        function fetchCallbackBinary(name, callback) {
            fetch(`http://${window.location.hostname}/${name}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok')
                    }
                    return response.arrayBuffer()
                })
                .then(callback)
                .catch(error => {
                    console.error('There was a problem with the fetch operation:', error)
                })
        }

        function fetchCallback(name, callback) {
            fetch(`http://${window.location.hostname}/${name}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok')
                    }
                    return response.text()
                })
                .then(callback)
                .catch(error => {
                    console.error('There was a problem with the fetch operation:', error)
                })
        }

        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16)
            const g = parseInt(hex.slice(3, 5), 16)
            const b = parseInt(hex.slice(5, 7), 16)

            return { r, g, b }
        }

        function rgbToHex(r, g, b) {
            const toHex = (v) => {
                const hex = v.toString(16);
                return hex.length === 1 ? "0" + hex : hex;
            };

            return "#" + toHex(r) + toHex(g) + toHex(b);
        }

        function selectController(id) {
            document.querySelectorAll(".controller").forEach(element => {
                element.classList.add("controller-closed");
            });
            document.getElementById(id).classList.remove("controller-closed");
        }

        // --------------------- enable switch
        
        const enable_switch = document.getElementById("enable-switch");

        enable_switch.addEventListener("change", e => {
            send("set_enabled", new Uint8Array([enable_switch.checked ? 1 : 0]));
        });

        // --------------------- enable separate

        const enable_separate = document.getElementById("enable-separate");

        enable_separate.addEventListener("change", e => {
            send("set_separate_enabled", new Uint8Array([enable_separate.checked ? 1 : 0]))
        });

        // --------------------- primary color
        
        const primary_color = document.getElementById("primary_color")
        primary_color.addEventListener("change", (event) => {
            let rgb = hexToRgb(event.target.value)
            send("set_primary_color", new Uint8Array([rgb.r, rgb.g, rgb.b]))
        })

        // --------------------- light slider

        const light_slider = document.getElementById("light_slider");
        bindSlider(light_slider, 'light_reset', 64, sliderFormatByte, "set_light")

        // ---------------------

        document.getElementById("separate-button").addEventListener("click", () => selectController("led-setup"));
        document.querySelectorAll(".back-to-main").forEach(element => {
            element.addEventListener("click", () => selectController("main-setup"))
        })

        // --------------------- fetch data

        document.addEventListener('DOMContentLoaded', () => {
            let fetchCounter = 4;
            const fetchEnd = () => {
                fetchCounter = fetchCounter - 1;
                if (fetchCounter <= 0) {
                    document.getElementById("loading-process").style.display = 'none';
                }
            };

            fetchCallbackBinary("get_enabled", data => {
                const bytes = new Uint8Array(data);
                enable_switch.checked = bytes[0];
                fetchEnd();
            });

            fetchCallbackBinary("get_separate_enabled", data => {
                const bytes = new Uint8Array(data);
                enable_separate.checked = bytes[0];
                fetchEnd();
            });

            fetchCallbackBinary("get_light", data => {
                const bytes = new Uint8Array(data);
                light_slider.value = bytes[0];
                fetchEnd();
            });

            fetchCallbackBinary("get_primary_color", data => {
                const bytes = new Uint8Array(data);
                primary_color.value = rgbToHex(bytes[0], bytes[1], bytes[2]);
                fetchEnd();
            });
        });
    </script>
</body>
</html>
